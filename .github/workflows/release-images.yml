name: Release Image Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New Git tag and GitHub Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-images-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      minimum_free_gib: ${{ steps.capacity.outputs.minimum_free_gib }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: capacity
        shell: bash
        run: |
          set -euo pipefail
          minimum_free_gib="$(jq -er '
            .minimumRunnerFreeGiB as $capacity
            | if ($capacity | type) != "number" or $capacity < 50 or ($capacity | floor) != $capacity then
                error("minimumRunnerFreeGiB must be an integer of at least 50")
              else
                $capacity
              end
          ' infra/images/images.json)"
          printf 'minimum_free_gib=%s\n' "${minimum_free_gib}" >>"${GITHUB_OUTPUT}"

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REF_TYPE}" == 'branch' ]] || {
            echo 'Run this workflow from a branch, not an existing tag.' >&2
            exit 1
          }
          git check-ref-format --allow-onelevel "refs/tags/${RELEASE_TAG}"
          git fetch --force --tags origin

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_commit="$(git rev-parse "${RELEASE_TAG}^{}")"
            [[ "${existing_commit}" == "${GITHUB_SHA}" ]] || {
              echo "Tag ${RELEASE_TAG} already points to ${existing_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' >/tmp/is-draft 2>/dev/null; then
            [[ "$(cat /tmp/is-draft)" == 'true' ]] || {
              echo "Release ${RELEASE_TAG} is already published." >&2
              exit 1
            }
          else
            gh release create "${RELEASE_TAG}" \
              --draft --generate-notes --title "${RELEASE_TAG}" --target "${GITHUB_SHA}"
          fi

          printf 'release_tag=%s\n' "${RELEASE_TAG}" >>"${GITHUB_OUTPUT}"

      - id: matrix
        shell: bash
        run: |
          set -euo pipefail

          matrix="$(jq -ce '
            def valid_id: type == "string" and test("^[a-z0-9][a-z0-9._-]*$");
            def valid_platform: type == "string" and test("^linux/[a-z0-9][a-z0-9._-]*$");
            if .schemaVersion != 1 then
              error("unsupported images.json schemaVersion")
            elif (.images | type) != "array" or (.images | length) == 0 then
              error("images must be a non-empty array")
            elif ([.images[] | select(
              (type != "object") or
              ((.id | valid_id) | not) or
              ((.reference | type) != "string") or
              ((.platforms | type) != "array") or
              ((.platforms | length) == 0) or
              ([.platforms[] | select(valid_platform | not)] | length > 0)
            )] | length) > 0 then
              error("each image needs an id, reference, and linux platforms")
            elif ([.images[] | select((.platforms | unique | length) != (.platforms | length))] | length) > 0 then
              error("image platforms must be unique")
            elif ([.images[].id] | unique | length) != (.images | length) then
              error("image ids must be unique")
            else
              [
                .images[] as $image
                | $image.platforms[] as $platform
                | {
                    id: $image.id,
                    reference: $image.reference,
                    platform: $platform,
                    asset_name: ($image.id + "--" + ($platform | gsub("/"; "-")))
                  }
              ]
            end
          ' infra/images/images.json)"

          printf 'matrix=%s\n' "${matrix}" >>"${GITHUB_OUTPUT}"

  build-images:
    needs: create-release
    runs-on: [self-hosted, linux, x64, release-images]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.create-release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.release_tag }}

      - name: Check runner capacity
        env:
          MINIMUM_FREE_GIB: ${{ needs.create-release.outputs.minimum_free_gib }}
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "${GITHUB_WORKSPACE}" | awk 'NR == 2 { print $4 }')"
          required_kib=$((MINIMUM_FREE_GIB * 1024 * 1024))
          ((available_kib >= required_kib)) || {
            echo "The release-images runner needs at least ${MINIMUM_FREE_GIB} GiB of free disk space." >&2
            exit 1
          }

      - name: Export ${{ matrix.reference }} for ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          bash infra/images/build-release-image.sh \
            '${{ matrix.id }}' \
            '${{ matrix.reference }}' \
            '${{ matrix.platform }}' \
            release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.asset_name }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

  publish-release:
    needs: [create-release, build-images]
    runs-on: [self-hosted, linux, x64, release-images]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.release_tag }}

      - name: Check runner capacity
        env:
          MINIMUM_FREE_GIB: ${{ needs.create-release.outputs.minimum_free_gib }}
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "${GITHUB_WORKSPACE}" | awk 'NR == 2 { print $4 }')"
          required_kib=$((MINIMUM_FREE_GIB * 1024 * 1024))
          ((available_kib >= required_kib)) || {
            echo "The release-images runner needs at least ${MINIMUM_FREE_GIB} GiB of free disk space." >&2
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: downloaded-assets
          merge-multiple: true

      - name: Assemble and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir release-metadata
          mapfile -t part_checksums < <(find downloaded-assets -type f -name '*.parts.sha256' -print | LC_ALL=C sort)
          mapfile -t archive_checksums < <(find downloaded-assets -type f -name '*.archive.sha256' -print | LC_ALL=C sort)
          mapfile -t metadata_files < <(find downloaded-assets -type f -name '*.asset.json' -print | LC_ALL=C sort)
          mapfile -t part_files < <(find downloaded-assets -type f -name '*.oci.tar.part-*' -print | LC_ALL=C sort)
          ((${#part_checksums[@]} > 0)) || { echo 'No part checksums downloaded.' >&2; exit 1; }
          ((${#archive_checksums[@]} > 0)) || { echo 'No archive checksums downloaded.' >&2; exit 1; }
          ((${#metadata_files[@]} > 0)) || { echo 'No asset metadata downloaded.' >&2; exit 1; }
          ((${#part_files[@]} > 0)) || { echo 'No image archive parts downloaded.' >&2; exit 1; }

          cat "${part_checksums[@]}" >release-metadata/SHA256SUMS.parts
          cat "${archive_checksums[@]}" >release-metadata/SHA256SUMS.archives
          jq -s '{schemaVersion: 1, images: .}' "${metadata_files[@]}" >release-metadata/release-images.json
          cp infra/images/load-release-image.sh release-metadata/load-image.sh
          chmod +x release-metadata/load-image.sh

          gh release upload "${RELEASE_TAG}" "${part_files[@]}" release-metadata/* --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
